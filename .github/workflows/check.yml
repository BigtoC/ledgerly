name: Check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'site/**'
      - '.github/workflows/github-pages.yml'
      - '.github/workflows/site-check.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'site/**'
      - '.github/workflows/github-pages.yml'
      - '.github/workflows/site-check.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyse + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Enforce layer boundaries
        # Rules and the baseline of known violations live in
        # import_analysis_options.yaml. Fails on a new violation or a stale
        # baseline entry. Also runs in the full suite below. See
        # docs/architecture/dependencies.md.
        run: flutter test test/unit/architecture/

      - name: Generate code (Drift / Freezed / Riverpod / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        # `dart analyze` waits for the riverpod_lint analysis-server plugin
        # (configured under `plugins:` in analysis_options.yaml), so its
        # warnings are reported every run. `flutter analyze` does not wait
        # for it and reports them only some of the time. `--fatal-infos`
        # keeps infos fatal, as `flutter analyze` does. A plugin that fails
        # to load is skipped without failing the run, so fail on that
        # message too rather than silently losing riverpod_lint.
        run: |
          set -o pipefail
          dart analyze --fatal-infos 2>&1 | tee analyze.log
          if grep -q 'error occurred while executing an analyzer plugin' analyze.log; then
            echo '::error::riverpod_lint plugin failed to load'
            exit 1
          fi

      - name: Run tests
        run: flutter test --reporter expanded

  android-build:
    name: Android APK builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Check if signing secrets exist
        id: check-secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.check-secrets.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/ledgerly-release.jks

      - name: Write key.properties
        if: steps.check-secrets.outputs.available == 'true'
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=ledgerly-release.jks
          EOF
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build signed release APK
        if: steps.check-secrets.outputs.available == 'true'
        run: flutter build apk --release --dart-define=FOREX_API_URL=${{ vars.FOREX_API_URL }}

      - name: Upload signed release APK artifact
        if: steps.check-secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ledgerly-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build debug APK
        if: steps.check-secrets.outputs.available != 'true'
        run: flutter build apk --debug --dart-define=FOREX_API_URL=${{ vars.FOREX_API_URL }}

      - name: Upload debug APK artifact
        if: steps.check-secrets.outputs.available != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ledgerly-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
