name: iOS nightly build

# iOS debug build so iOS-only breakage never surprises us at release
# time (see implementation-plan.md risk #12). Despite the name it is not
# scheduled. It runs on demand and on PRs that change dependencies or
# ios/, because a package upgrade can change which native code ends up
# in Runner.app.

on:
  pull_request:
    branches: [main]
    paths:
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'ios/**'
      - '.github/workflows/ios-nightly.yml'
  workflow_dispatch: {}

jobs:
  ios-build:
    name: iOS debug build (no codesign)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get --enforce-lockfile
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --no-codesign --debug

      - name: Check the build used Swift Package Manager only
        # Every iOS plugin ships a Package.swift, so ios/ has no Podfile.
        # If a CocoaPods-only plugin is added, Flutter writes a Podfile and
        # runs pod install. Fail here so that change is made on purpose.
        run: |
          if [ -e ios/Podfile ]; then
            echo "::error::flutter build ios created ios/Podfile, so a plugin needs CocoaPods"
            exit 1
          fi

      - name: Check SQLite is embedded
        # sqlite3 3.x ships SQLite as a build-hook code asset, and Flutter
        # embeds libsqlite3.dylib as sqlite3.framework. Without it the app
        # cannot open its database at startup.
        run: |
          ls build/ios/iphoneos/Runner.app/Frameworks
          test -f build/ios/iphoneos/Runner.app/Frameworks/sqlite3.framework/sqlite3
