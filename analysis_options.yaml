# Static analysis configuration.
#
# Layer-boundary enforcement comes from two places:
#   1. `riverpod_lint` (loaded below via the top-level `plugins:` key, the
#      Dart analysis_server_plugin system) checks Riverpod usage.
#   2. `test/unit/architecture/layer_boundaries_test.dart` encodes the
#      PRD -> Layer Boundaries table. Its rules live in
#      `import_analysis_options.yaml` at the repo root, not in this file.
#      CI runs it as its own step (`flutter test test/unit/architecture/`)
#      before `dart analyze --fatal-infos`.
#
# Generated code is excluded; every other file is analyzed.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/*.config.dart"
    - "lib/generated/**"
    # gen-l10n output. Flutter 3.50's template still lists the deprecated
    # flutter_localizations Material and Cupertino delegates
    # (flutter/flutter#191072); the app uses appLocalizationsDelegates.
    - "lib/l10n/**"
    - ".dart_tool/**"
    - "build/**"
    # drift_dev `schema generate` output — regenerated from the committed
    # JSON snapshots in `drift_schemas/` and consumed by the migration
    # harness at `test/unit/repositories/migration_test.dart`.
    - "test/unit/repositories/_harness/generated/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Freezed occasionally emits annotations on non-targets; keep info-level.
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# riverpod_lint 3.1+ is an analysis_server_plugin, not a custom_lint plugin.
# The analysis server resolves it in its own package (it is not a pubspec
# dependency). 3.2.0 needs Dart 3.13+ and pins riverpod 3.5.0, matching
# pubspec. On Dart 3.14 the analysis server asks for analysis_server_plugin
# ^0.3.21-dev, and 3.2.0 resolves against 0.3.26 and analyzer 14. On Dart
# 3.12, 3.1.4 was the only working release: 3.1.0-3.1.3 cannot resolve
# against that analysis_server_plugin, 3.1.6 does not resolve, and 3.1.7
# and 3.1.8 (analyzer 13) hang `dart analyze`. A version that fails to
# resolve is skipped silently: no error message, no riverpod_lint
# diagnostics, and the run passes. So after changing this, add a temporary
# violation (a public field on a Notifier trips
# avoid_public_notifier_properties) and check that `dart analyze` reports
# it. `dart analyze` waits for the plugin and
# always reports its warnings; `flutter analyze` does not wait and reports
# them only some of the time. CI runs `dart analyze --fatal-infos`, so
# riverpod_lint warnings fail the build.
plugins:
  riverpod_lint: 3.2.0

linter:
  rules:
    # Hygiene
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    use_super_parameters: true

# Layer-boundary rules are NOT configured here. They live in
# `import_analysis_options.yaml` at the repo root. See that file for the
# layer-boundary policy.
