# Static analysis configuration.
#
# Layer-boundary enforcement comes from two places:
#   1. `riverpod_lint` (loaded below via the top-level `plugins:` key, the
#      Dart analysis_server_plugin system) checks Riverpod usage.
#   2. `import_lint` encodes the PRD -> Layer Boundaries table. Its rules
#      live in `import_analysis_options.yaml` at the repo root (required
#      by import_lint ^0.1.6 — do NOT move them back into this file, the
#      0.1.6 runner will not find them). Runs via `dart run import_lint`,
#      wired into CI alongside `flutter analyze`.
#
# Generated code is excluded; every other file is analyzed.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.drift.dart"
    - "**/*.config.dart"
    - "lib/generated/**"
    - ".dart_tool/**"
    - "build/**"
    # drift_dev `schema generate` output — regenerated from the committed
    # JSON snapshots in `drift_schemas/` and consumed by the migration
    # harness at `test/unit/repositories/migration_test.dart`.
    - "test/unit/repositories/_harness/generated/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # Freezed occasionally emits annotations on non-targets; keep info-level.
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

# riverpod_lint 3.1+ is an analysis_server_plugin, not a custom_lint plugin.
# The analysis server resolves it in its own package (it is not a pubspec
# dependency). On Dart 3.12, 3.1.4 is the only release that works: the
# analysis server needs analysis_server_plugin ^0.3.8, which 3.1.0-3.1.3
# cannot resolve against; 3.1.6 does not resolve; 3.1.7 and 3.1.8
# (analyzer 13) hang `dart analyze`; 3.1.9 needs Dart 3.13. A plugin that
# fails to resolve is skipped without failing the run, so after changing
# this, check that `dart analyze` prints no "An error occurred while
# executing an analyzer plugin" message.
plugins:
  riverpod_lint: 3.1.4

linter:
  rules:
    # Hygiene
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    prefer_single_quotes: true
    unawaited_futures: true
    use_super_parameters: true

# import_lint rules are NOT configured here. They live in
# `import_analysis_options.yaml` at the repo root (required by
# import_lint ^0.1.6). See that file for the layer-boundary policy.
