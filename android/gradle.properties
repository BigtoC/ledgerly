org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin is on deliberately: AGP 9 compiles Kotlin itself, so
# app/build.gradle.kts does not apply kotlin-android. Flutter 3.50.0 supports
# this; its template and migrator default to false instead.
android.builtInKotlin=true
# The new AGP DSL stays off: android_file_picker (up to 2.1.5, from
# file_picker) configures the legacy LibraryExtension and fails under
# android.newDsl=true. Flutter 3.50.0's own plugin no longer needs the legacy
# API. Flip this to true once the plugin is fixed; do not delete it, because
# Flutter's DisableNewDslMigration adds android.newDsl=false back.
android.newDsl=false
