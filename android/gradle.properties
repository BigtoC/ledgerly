org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin is on deliberately: AGP 9 compiles Kotlin itself, so
# app/build.gradle.kts does not apply kotlin-android. Flutter 3.47.7 supports
# this; its template and migrator default to false instead.
android.builtInKotlin=true
# The new AGP DSL stays off: the Flutter Gradle Plugin (3.47.7) still reads
# the legacy AbstractAppExtension / applicationVariants API and fails to apply
# under android.newDsl=true (flutter/flutter#166550). Flip it once Flutter's
# plugin moves to the new variant API.
android.newDsl=false
