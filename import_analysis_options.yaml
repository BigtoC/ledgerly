# Layer-boundary rules — PRD § Layer Boundaries.
#
# Enforced by `test/unit/architecture/layer_boundaries_test.dart`, which
# runs as its own early CI step (`flutter test test/unit/architecture/`)
# and again in the full suite. That test is the only reader of this file.
#
# Rule names mirror the PRD -> Layer Boundaries table. lib/ follows the
# Flutter team's layout (PRD § folder layout): ui/ by feature, domain/
# and data/ by type. The two ui/ rules key on folder plus file suffix and
# split lib/ui/ between them with theme_stays_pure, so every new ui/ file
# is covered without editing this list. The test also fails when a lib/
# file matches no rule (main.dart, the service providers and generated
# l10n aside), a lib/ui/ file matches more than one, or a rule matches no
# file at all.
#
# Schema (regex-based; the key names come from the retired import_lint
# 0.1.6, which never matched them):
#   search_file_path_reg_exp   matched against the repo-relative path of
#                              each lib/**/*.dart file (generated
#                              *.g.dart / *.freezed.dart excluded), e.g.
#                              `lib/ui/features/home/views/home_screen.dart`.
#   not_allow_import_reg_exps  optional; matched against every import /
#                              export URI in that file. Relative URIs are
#                              resolved first and rewritten to
#                              `package:ledgerly/...`, so one pattern
#                              covers both forms.
#   ignore_import_reg_exps     optional; a URI matching one of these is
#                              never a violation.
#   not_allow_export_reg_exps  optional; like not_allow_import_reg_exps,
#                              but matched against `export` URIs only.
#
# Import paths cannot show what a file reaches through a provider, so the
# ui/ rules also forbid the app-layer files that build data-layer
# objects: `app/providers/service_providers.dart` (services) and
# `app/providers/app_database_provider.dart` (`AppDatabase`) everywhere
# under ui/, and `app/providers/repository_providers.dart` (repositories
# and use cases) everywhere except view-model controllers and
# *_providers.dart. App-level values that widgets may read, such as
# `exchangeRatesProvider`, live in their own files under app/providers/.
# Platform and I/O plugins belong in services, or in a core/ wrapper such
# as `core/utils/system_browser.dart` (PRD), so both ui/ rules forbid
# them too.
rules:
  # Widgets may only import their own controller and UI primitives — no
  # repositories, services, DB, DAOs, Drift or platform packages, and not
  # the providers that build repositories or services. Deny-by-default:
  # covers every lib/ui/ file except the theme (theme_stays_pure) and the
  # *_controller.dart / *_providers.dart files directly in a slice's or
  # sub-slice's view_models/ (controllers_forbid_db_and_services). So
  # views/, ui/core/widgets/, and the *_state.dart files and pure helpers
  # in view_models/ all land here. Of data/ and domain/ they may import
  # only domain models. Name a file *_controller.dart or *_providers.dart,
  # in view_models/, if it needs repositories.
  widgets_forbid_data_internals:
    search_file_path_reg_exp: "^lib/ui/(?!core/theme/)(?!features/(?:(?!views/|view_models/)[^/]+/){1,2}view_models/[^/]+_(controller|providers)\\.dart$).*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/"
      - "^package:ledgerly/domain/(?!models/)"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/repository_providers\\.dart$"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:ledgerly/app/providers/app_database_provider\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
      - "^package:url_launcher/"
    ignore_import_reg_exps: []

  # Controllers and slice-local *_providers.dart may import repositories,
  # use cases, domain models — never AppDatabase, DAOs, Drift, services,
  # the providers that build services, or platform packages. They may not
  # re-export repositories or the providers that build them either: each
  # rule checks a file's own directives only, so such an export would hand
  # them to every widget that imports the controller.
  controllers_forbid_db_and_services:
    search_file_path_reg_exp: "^lib/ui/features/(?:(?!views/|view_models/)[^/]+/){1,2}view_models/[^/]+_(controller|providers)\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/seed/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:ledgerly/app/providers/app_database_provider\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
      - "^package:url_launcher/"
    not_allow_export_reg_exps:
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/app/providers/repository_providers\\.dart$"
    ignore_import_reg_exps: []

  # Use cases and the first-run seed may import repositories, services and
  # domain models — never UI or app code. They may take `AppDatabase` from
  # app_database.dart to run one `db.transaction` across repositories, but
  # never a DAO, a table or Drift itself.
  use_cases_forbid_ui:
    search_file_path_reg_exp: "^lib/(domain/(?!models/)|data/seed/).*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/ui/"
      - "^package:ledgerly/app/"
      - "^package:ledgerly/data/database/(?!app_database\\.dart$)"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
      - "^package:url_launcher/"
    ignore_import_reg_exps: []

  # Repositories may import services, AppDatabase, DAOs, domain models —
  # never use cases or upstream layers.
  repositories_forbid_upstream:
    search_file_path_reg_exp: "^lib/data/repositories/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/ui/"
      - "^package:ledgerly/domain/(?!models/)"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Services may import external SDKs only — never peers (repositories,
  # models, database) or upstream layers. They return Dart records, which
  # repositories map to domain models. data/models/ does not exist; its
  # ban is a tripwire in case the folder comes back.
  services_forbid_upstream_and_siblings:
    search_file_path_reg_exp: "^lib/data/services/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/data/models/"
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/ui/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Domain models (Freezed) stay pure. No Drift, no services,
  # no repositories, no use cases, no upstream.
  models_forbid_non_pure:
    search_file_path_reg_exp: "^lib/domain/models/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/"
      - "^package:ledgerly/domain/(?!models/)"
      - "^package:ledgerly/ui/"
      - "^package:ledgerly/app/"
      - "^package:drift/"
      - "^package:drift_flutter/"
    ignore_import_reg_exps: []

  # Drift tables / DAOs stay at the bottom of the stack.
  database_forbid_upstream:
    search_file_path_reg_exp: "^lib/data/database/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/ui/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # core/ is importable from anywhere: pure, non-widget utilities and
  # generated l10n. It may import Flutter / SDK packages and the plain
  # domain models in domain/models/ (e.g. `Currency.decimals` for money
  # formatting), but must not reach into data/, use cases, ui/ or app/.
  # That includes the theme: data and domain import core freely, so core
  # importing ui/core/theme/ would let them reach the UI layer.
  core_stays_pure:
    search_file_path_reg_exp: "^lib/core/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/"
      - "^package:ledgerly/ui/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps:
      - "^package:ledgerly/domain/models/"

  # The theme (ui/core/theme/) is as pure as core/: Flutter, core/ and
  # domain models only, and nothing else from ui/.
  theme_stays_pure:
    search_file_path_reg_exp: "^lib/ui/core/theme/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/"
      - "^package:ledgerly/ui/(?!core/theme/)"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps:
      - "^package:ledgerly/domain/models/"

  # app/ wires services into repositories, use cases and app-level values;
  # it does not call platform plugins itself (PRD: external SDKs belong in
  # services). `app/providers/service_providers.dart` builds the services
  # and is the one app/ file the path regex leaves out.
  app_forbids_platform_plugins:
    search_file_path_reg_exp: "^lib/app/(?!providers/service_providers\\.dart$).*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:package_info_plus/"
      - "^package:path_provider/"
      - "^package:file_picker/"
      - "^package:file_selector/"
    ignore_import_reg_exps: []

# Violations that predate enforcement (import_lint 0.1.6 never matched a
# rule, so nothing was checked until the test above replaced it). Each is
# tolerated so that only NEW violations fail. Fix the code, then delete
# the entry: the test fails on an entry that no longer occurs, so this
# list can only shrink. `import` is the normalised `package:ledgerly/...`
# form. Do not add entries for new code.
baseline: []
