# Layer-boundary rules — PRD § Layer Boundaries.
#
# Enforced by `test/unit/architecture/layer_boundaries_test.dart`, which
# runs as its own early CI step (`flutter test test/unit/architecture/`)
# and again in the full suite. That test is the only reader of this file.
#
# Rule names mirror the PRD -> Layer Boundaries table. Use cases live in
# `lib/data/use_cases/` (PRD § folder layout); `use_cases_forbid_ui` also
# covers a future `lib/domain/`.
#
# Schema (regex-based; the key names come from the retired import_lint
# 0.1.6, which never matched them):
#   search_file_path_reg_exp   matched against the repo-relative path of
#                              each lib/**/*.dart file (generated
#                              *.g.dart / *.freezed.dart excluded), e.g.
#                              `lib/features/home/home_screen.dart`.
#   not_allow_import_reg_exps  matched against every import / export URI
#                              in that file. Relative URIs are resolved
#                              first and rewritten to
#                              `package:ledgerly/...`, so one pattern
#                              covers both forms.
#   ignore_import_reg_exps     optional; a URI matching one of these is
#                              never a violation.
rules:
  # Widgets (features/*/*_screen.dart) may only import their own
  # controller and UI primitives — no repositories, services, DB, DAOs,
  # or Drift packages.
  widgets_forbid_data_internals:
    search_file_path_reg_exp: "^lib/features/.*_screen\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
    ignore_import_reg_exps: []

  widget_helpers_forbid_data_internals:
    search_file_path_reg_exp: "^lib/features/.*/widgets/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
    ignore_import_reg_exps: []

  # Controllers may import repositories, use cases, domain models —
  # never AppDatabase, DAOs, Drift, or services.
  controllers_forbid_db_and_services:
    search_file_path_reg_exp: "^lib/features/.*_controller\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
    ignore_import_reg_exps: []

  # State classes stay presentation-only: domain models fine, data
  # internals forbidden.
  states_forbid_data_internals:
    search_file_path_reg_exp: "^lib/features/.*_state\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:drift/"
      - "^package:drift_flutter/"
    ignore_import_reg_exps: []

  # Use cases (Phase 2) may import repositories, services, domain
  # models — never controllers or widgets.
  use_cases_forbid_ui:
    search_file_path_reg_exp: "^lib/(domain|data/use_cases)/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/features/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Repositories may import services, AppDatabase, DAOs, domain models —
  # never upstream layers.
  repositories_forbid_upstream:
    search_file_path_reg_exp: "^lib/data/repositories/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Services may import external SDKs only — never peers (repositories,
  # models, database) or upstream layers.
  services_forbid_upstream_and_siblings:
    search_file_path_reg_exp: "^lib/data/services/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/data/models/"
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Domain models (Freezed) stay pure. No Drift, no services,
  # no repositories, no upstream.
  models_forbid_non_pure:
    search_file_path_reg_exp: "^lib/data/models/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
      - "^package:drift/"
      - "^package:drift_flutter/"
    ignore_import_reg_exps: []

  # Drift tables / DAOs stay at the bottom of the stack.
  database_forbid_upstream:
    search_file_path_reg_exp: "^lib/data/database/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # core/ is importable from anywhere, but must not reach back into the
  # feature / data / app layers — pure utilities, theme, generated l10n.
  core_stays_pure:
    search_file_path_reg_exp: "^lib/core/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

# Violations that predate enforcement (import_lint 0.1.6 never matched a
# rule, so nothing was checked until the test above replaced it). Each is
# tolerated so that only NEW violations fail. Fix the code, then delete
# the entry: the test fails on an entry that no longer occurs, so this
# list can only shrink. `import` is the normalised `package:ledgerly/...`
# form. Do not add entries for new code.
baseline:
  # Catches CategoryTypeLockedException from the repository. The
  # controller should translate it into state instead.
  - rule: widget_helpers_forbid_data_internals
    file: lib/features/categories/widgets/category_form_sheet.dart
    import: package:ledgerly/data/repositories/category_repository.dart
  # Catches CategoryInUseException from the repository. The controller
  # should translate it into state instead.
  - rule: widgets_forbid_data_internals
    file: lib/features/categories/categories_screen.dart
    import: package:ledgerly/data/repositories/category_repository.dart
  # Takes the Currency domain model for `decimals` (PRD -> Money Storage
  # Policy). The PRD Layer Boundaries table does not cover core/; this
  # repo-local rule may be stricter than intended for data/models/.
  - rule: core_stays_pure
    file: lib/core/utils/money_formatter.dart
    import: package:ledgerly/data/models/currency.dart
