# Layer-boundary rules — PRD § Layer Boundaries.
#
# Enforced by `test/unit/architecture/layer_boundaries_test.dart`, which
# runs as its own early CI step (`flutter test test/unit/architecture/`)
# and again in the full suite. That test is the only reader of this file.
#
# Rule names mirror the PRD -> Layer Boundaries table. Use cases live in
# `lib/data/use_cases/` (PRD § folder layout); `use_cases_forbid_ui` also
# covers a future `lib/domain/`. The table names only screens and
# controllers under features/; the other feature rules extend it so that
# every lib/features/ file matches at least one rule.
#
# Schema (regex-based; the key names come from the retired import_lint
# 0.1.6, which never matched them):
#   search_file_path_reg_exp   matched against the repo-relative path of
#                              each lib/**/*.dart file (generated
#                              *.g.dart / *.freezed.dart excluded), e.g.
#                              `lib/features/home/home_screen.dart`.
#   not_allow_import_reg_exps  matched against every import / export URI
#                              in that file. Relative URIs are resolved
#                              first and rewritten to
#                              `package:ledgerly/...`, so one pattern
#                              covers both forms.
#   ignore_import_reg_exps     optional; a URI matching one of these is
#                              never a violation.
#
# Import paths cannot show what a file reaches through a provider, so the
# feature rules also forbid the app-layer files that build repositories
# and services: `app/providers/service_providers.dart` (services)
# everywhere under features/, and `app/providers/repository_providers.dart`
# (repositories and use cases) everywhere except controllers and
# *_providers.dart. `app_database_provider.dart` and
# `locale_service_provider.dart` are not policed yet; no feature file
# imports them. App-level values that widgets may read, such as
# `exchangeRatesProvider`, live in their own files under app/providers/.
# Platform and I/O plugins belong in services (PRD), so every feature
# rule forbids them too.
rules:
  # Widgets (features/*/*_screen.dart) may only import their own
  # controller and UI primitives — no repositories, services, DB, DAOs,
  # Drift or platform packages, and not the providers that build
  # repositories or services.
  widgets_forbid_data_internals:
    search_file_path_reg_exp: "^lib/features/.*_screen\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/repository_providers\\.dart$"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
    ignore_import_reg_exps: []

  widget_helpers_forbid_data_internals:
    search_file_path_reg_exp: "^lib/features/.*/widgets/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/repository_providers\\.dart$"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
    ignore_import_reg_exps: []

  # Controllers may import repositories, use cases, domain models —
  # never AppDatabase, DAOs, Drift, services, the providers that build
  # services, or platform packages.
  controllers_forbid_db_and_services:
    search_file_path_reg_exp: "^lib/features/.*_controller\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
    ignore_import_reg_exps: []

  # State classes stay presentation-only: domain models fine, data
  # internals and the providers that build them forbidden.
  states_forbid_data_internals:
    search_file_path_reg_exp: "^lib/features/.*_state\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/repository_providers\\.dart$"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
    ignore_import_reg_exps: []

  # Slice-local helper providers (features/**/*_providers.dart) sit next
  # to controllers and follow the controller rule: repositories, domain
  # models and app/providers are fine — never AppDatabase, DAOs, Drift,
  # services, the providers that build services, or platform packages.
  feature_providers_forbid_db_and_services:
    search_file_path_reg_exp: "^lib/features/.*_providers\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
    ignore_import_reg_exps: []

  # Catch-all for every other feature file: widgets not named
  # *_screen.dart (e.g. charts_section.dart) and presentation helpers or
  # codecs (e.g. selected_slice.dart, amount_formula.dart). They follow
  # the widget rule. The path regex excludes the files the rules above
  # cover (*_controller / *_providers / *_state / *_screen.dart and
  # anything under widgets/), so it never overlaps them, and a new
  # feature file is covered without editing this list. Name a file
  # *_controller.dart or *_providers.dart if it needs repositories.
  feature_files_forbid_data_internals:
    search_file_path_reg_exp: "^lib/features/(?!.*_(controller|providers|state|screen)\\.dart$)(?!.*/widgets/).*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:drift/"
      - "^package:drift_flutter/"
      - "^package:path_provider/"
      - "^package:ledgerly/app/providers/repository_providers\\.dart$"
      - "^package:ledgerly/app/providers/service_providers\\.dart$"
      - "^package:package_info_plus/"
      - "^package:dio/"
      - "^package:file_picker/"
      - "^package:file_selector/"
    ignore_import_reg_exps: []

  # Use cases (Phase 2) may import repositories, services, domain
  # models — never controllers or widgets.
  use_cases_forbid_ui:
    search_file_path_reg_exp: "^lib/(domain|data/use_cases)/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/features/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Repositories may import services, AppDatabase, DAOs, domain models —
  # never upstream layers.
  repositories_forbid_upstream:
    search_file_path_reg_exp: "^lib/data/repositories/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Services may import external SDKs only — never peers (repositories,
  # models, database) or upstream layers.
  services_forbid_upstream_and_siblings:
    search_file_path_reg_exp: "^lib/data/services/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/data/models/"
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # Domain models (Freezed) stay pure. No Drift, no services,
  # no repositories, no upstream.
  models_forbid_non_pure:
    search_file_path_reg_exp: "^lib/data/models/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/database/"
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
      - "^package:drift/"
      - "^package:drift_flutter/"
    ignore_import_reg_exps: []

  # Drift tables / DAOs stay at the bottom of the stack.
  database_forbid_upstream:
    search_file_path_reg_exp: "^lib/data/database/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/services/"
      - "^package:ledgerly/data/repositories/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps: []

  # core/ is importable from anywhere: pure utilities, theme, generated
  # l10n. It may import Flutter / SDK packages and the plain domain models
  # in data/models/ (e.g. `Currency.decimals` for money formatting), but
  # must not reach back into the rest of data/ (database, repositories,
  # services, seed, use cases) or the feature / domain / app layers.
  # data/ is forbidden as a whole and only data/models/ is exempted, so a
  # new data/ subdirectory is forbidden until a rule says otherwise.
  core_stays_pure:
    search_file_path_reg_exp: "^lib/core/.*\\.dart$"
    not_allow_import_reg_exps:
      - "^package:ledgerly/data/"
      - "^package:ledgerly/features/"
      - "^package:ledgerly/domain/"
      - "^package:ledgerly/app/"
    ignore_import_reg_exps:
      - "^package:ledgerly/data/models/"

# Violations that predate enforcement (import_lint 0.1.6 never matched a
# rule, so nothing was checked until the test above replaced it). Each is
# tolerated so that only NEW violations fail. Fix the code, then delete
# the entry: the test fails on an entry that no longer occurs, so this
# list can only shrink. `import` is the normalised `package:ledgerly/...`
# form. Do not add entries for new code.
baseline: []
