name: ledgerly
description: Local-first Flutter expense tracker. See PRD.md for the spec.
publish_to: "none"
version: 0.7.4

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

# Dependency list mirrors PRD.md -> Dependencies (Core + shipped Phase 2).
# Deferred Phase 2/3 packages (flutter_secure_storage, csv, ...) are NOT
# added here; they land with their corresponding milestone.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # App shell / state
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Local database
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Navigation
  go_router: ^18.1.2

  # Domain modelling
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # i18n
  intl: ^0.20.2

  # UI components
  flutter_slidable: ^4.0.3

  # App info
  package_info_plus: ^10.2.2

  # In-app browser
  webview_flutter: ^4.14.1

  # System browser launcher (About page → "Open in browser" action)
  url_launcher: ^6.3.3

  # HTTP client (Phase 2 exchange-rate fetch)
  dio: ^5.11.1

  # SHA-256 of downloaded update APKs (pure Dart, no assets)
  crypto: ^3.0.8

  # Charts (Analysis tab pie + bar charts).
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation runners. build_runner stays on 2.16.x: 2.17.1 requires
  # build 5.0 (2.17.0 is retracted), while drift_dev and riverpod_generator
  # still cap build below 5.0.
  build_runner: ^2.16.2
  drift_dev: ^2.35.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  riverpod_generator: ^4.0.9

  # Linting / static analysis. riverpod_lint 3.1+ is an analysis_server_plugin
  # loaded from `analysis_options.yaml -> plugins:`, so it (and custom_lint)
  # no longer belong here.
  flutter_lints: ^6.0.0

  # Testing
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  # Reads import_analysis_options.yaml in
  # test/unit/architecture/layer_boundaries_test.dart.
  yaml: ^3.1.4

  # Native splash is a codegen CLI (`dart run flutter_native_splash:create`),
  # never imported at runtime, so it belongs in dev_dependencies even though
  # PRD lists it under Core (MVP).
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Splash slice assets. `sun-splash.png` now backs both the runtime
    # Flutter splash and the native splash regeneration step. Listed by
    # file so the directory's README.md is not bundled into the app.
    - assets/splash/sun-splash.png

# Native splash config. `background_image` is supported on iOS and
# pre-Android-12. Android 12+ only supports a solid background plus a
# centered splash image, so that section keeps explicit fallback colors.
flutter_native_splash:
  background_image_android: assets/splash/sun-splash.png
  background_image_ios: assets/splash/sun-splash.png
  fullscreen: true
  android_12:
    color: "#D9A06C"
    color_dark: "#2B1828"
  android: true
  ios: true
  web: false
